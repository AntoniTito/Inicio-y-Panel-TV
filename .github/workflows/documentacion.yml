name: Documentación y formatos
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Comprobar enlaces, JSON y PowerShell
        shell: powershell
        run: .\herramientas\verificar-documentacion.ps1
